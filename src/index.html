<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'; img-src 'self' data: blob:; worker-src 'self' blob:;"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Agent Micro</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="shell" id="shell">
      <div class="chrome drag">
        <span class="chrome-title">
          Agent Micro
          <i class="link-dot" id="link-dot" title="Connection"></i>
        </span>
        <div class="chrome-actions no-drag">
          <button type="button" class="chrome-btn" id="btn-icons" title="Icon picker">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2.7 10.3a2.41 2.41 0 0 0 0 3.41l7.59 7.59a2.41 2.41 0 0 0 3.41 0l7.59-7.59a2.41 2.41 0 0 0 0-3.41l-7.59-7.59a2.41 2.41 0 0 0-3.41 0Z"/></svg>
          </button>
          <button type="button" class="chrome-btn" id="btn-reconnect" title="Reconnect">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/><path d="M8 16H3v5"/></svg>
          </button>
          <button type="button" class="chrome-btn" id="btn-min" title="Minimize">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/></svg>
          </button>
          <button type="button" class="chrome-btn close" id="btn-close" title="Close">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
          </button>
        </div>
      </div>

      <div class="pad pad-3d" id="pad" role="application" aria-label="Agent Micro">
        <div class="pad-ring" id="pad-ring" aria-hidden="true"></div>
        <div class="pad-canvas" id="pad-canvas"></div>
      </div>

      <div class="icon-picker" id="icon-picker" hidden>
        <div class="icon-picker-card">
          <div class="icon-picker-head">
            <span id="icon-picker-title">Choose icon</span>
            <button type="button" class="chrome-btn" id="icon-picker-close" title="Close">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
            </button>
          </div>
          <div class="icon-picker-grid" id="icon-picker-grid"></div>
          <p class="icon-picker-hint">Lucide + Lobe 브랜드 로고 · 우클릭으로 변경</p>
        </div>
      </div>

      <div class="hud">
        <div class="hud-row">
          <span class="hud-label">Link</span>
          <span class="hud-value" id="hud-link">connecting…</span>
        </div>
        <div class="hud-row">
          <span class="hud-label">Task</span>
          <span class="hud-value" id="hud-task">—</span>
        </div>
        <div class="hud-row">
          <span class="hud-label">Status</span>
          <span class="hud-value" id="hud-status">idle</span>
        </div>
        <div class="hud-row">
          <span class="hud-label">Reasoning</span>
          <span class="hud-value" id="hud-reason">medium</span>
        </div>
        <div class="hud-row">
          <span class="hud-label">Action</span>
          <span class="hud-value" id="hud-action">ready</span>
        </div>
        <div class="legend">
          <span><i class="dot idle"></i>idle</span>
          <span><i class="dot thinking"></i>thinking</span>
          <span><i class="dot complete"></i>complete</span>
          <span><i class="dot input"></i>needs input</span>
          <span><i class="dot error"></i>error</span>
        </div>
      </div>
    </div>

    <script type="module" src="./app.mjs"></script>
  </body>
</html>
