name: Bug report
description: Report a reproducible problem in Agent Micro
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a problem. Please remove private paths, tokens, and project code from screenshots and logs.
  - type: input
    id: version
    attributes:
      label: Agent Micro version
      placeholder: "1.0.0 or local build"
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version and Mac model
      placeholder: "macOS 15.x, Apple Silicon"
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Tell us exactly what you clicked or typed.
      placeholder: |
        1. Open Agent Micro
        2. Connect Codex
        3. Click Agent 1
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: Remove secrets and private project contents before posting.
